[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prompt-leaks"
version = "0.1.0"
description = "Detect and redact secrets in prompts before they are sent to an AI model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "prompt-leaks contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
presidio = [
  "presidio-analyzer>=2.2.360,<3",
  "presidio-anonymizer>=2.2.360,<3",
]
sensitive = [
  "gliner>=0.2.17,<1",
  "huggingface-hub>=0.30,<2",
  "protobuf>=5,<7",
  "sentencepiece>=0.2.2,<0.2.3",
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]

[project.scripts]
prompt-leaks-api = "prompt_leaks.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_leaks"]

